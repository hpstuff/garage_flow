# Manual deploy to Coolify — builds, pushes to GHCR, then triggers a rebuild via webhook.
# Trigger: workflow_dispatch (manual button in GitHub Actions > Workflows > "Deploy" → Run Workflow)

name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (branch)
        uses: docker/build-push-action@v6
        if: github.ref_type == 'branch'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push image (tag)
        uses: docker/build-push-action@v6
        if: github.ref_type == 'tag'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.event_name }}-${{ github.ref_name }}

  trigger-coolify:
    name: Trigger Coolify rebuild
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild via Coolify webhook
        run: |
          curl --fail -X POST "${{ secrets.COOLIFY_WEBHOOK }}" \
            -H "Content-Type: application/json"
