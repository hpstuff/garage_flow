name: CI

on:
  push:
    branches: [main]
  pull_request:

# The pipeline (ADR-0018): typecheck → Biome (incl. the ADR-0015 import boundary)
# → unit + integration (against a real throwaway Postgres) → build the Docker image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: garageflow
          POSTGRES_PASSWORD: garageflow
          POSTGRES_DB: garageflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garageflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://garageflow:garageflow@localhost:5432/garageflow
      BETTER_AUTH_SECRET: ci-secret-not-used-in-prod
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint + format + import boundary (ADR-0015)
        run: npm run lint

      - name: Apply migrations from a clean database
        run: npm run db:migrate

      - name: Unit + integration tests (real Postgres)
        run: npm test

      - name: Build
        run: npm run build

  docker:
    # ADR-0018: the pipeline ends by building the deployable image (Kamal, ADR-0012).
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: garage-flow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
